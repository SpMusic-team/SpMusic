# 前端类型检查、构建与 lint 红线。
#
# 只监听 develop 的 push：本仓库是单人主干开发，不经过 Pull Request，
# 所以不做 PR 事件触发。手动触发保留给排查用。
name: CI

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 同一分支的新推送取消上一次未跑完的任务，避免排队浪费额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vite 8 要求 ^20.19.0 || >=22.12.0，与本地开发保持一致用 24
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查与构建
        run: npm run build
