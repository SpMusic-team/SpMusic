[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rodio = { version = "0.19.0", default-features = false, features = [
  "symphonia-aac",
  "symphonia-flac",
  "symphonia-isomp4",
  "symphonia-mp3",
  "symphonia-vorbis",
  "symphonia-wav",
] }
rfd = "0.14.1"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories = "6.0.0"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
lofty = "0.24.0"
symphonia = { version = "0.5.5", default-features = false, features = [
  "aac",
  "aiff",
  "alac",
  "caf",
  "flac",
  "isomp4",
  "mkv",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }
symphonia-adapter-libopus = { version = "0.2.0", features = ["bundled"] }
matroska-demuxer = { path = "vendor/matroska-demuxer", version = "=0.8.0" }
blake3 = "1.8.5"
base64 = "0.22.1"
windows = { version = "0.54.0", features = [
  "implement",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_UI_Shell_PropertiesSystem",
] }
